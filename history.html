<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task History - Day Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <h1>✅ Task History</h1>
                <a class="header-icon-link" href="index.html" aria-label="Home" title="Home">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" /></svg>
                </a>
            </div>
        </header>
        <main>
            <section class="panel">
                <div class="history-heading">
                    <h2>Finished Tasks</h2>
                    <button id="clearHistoryBtn" class="btn-danger" type="button">Clear history</button>
                </div>
                <ul id="historyList" class="task-list"></ul>
            </section>
        </main>
        <footer>
            <p>Completed tasks with finishing dates</p>
        </footer>
    </div>
    <script src="history.js"></script>
</body>
</html>
